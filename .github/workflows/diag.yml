name: Diagnostico
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - env: { TRAVELPAYOUTS_TOKEN: "${{ secrets.TRAVELPAYOUTS_TOKEN }}" }
        run: python engine/diag.py
      - run: |
          git config user.name partiu085-bot; git config user.email partiu085-bot@users.noreply.github.com
          git add docs/diag.json; git commit -m diag; git pull --rebase -q; git push
