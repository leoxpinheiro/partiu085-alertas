name: Notícias (de hora em hora)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  noticias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - run: python engine/descobrir.py --noticias
      - name: Salvar
        run: |
          git config user.name "partiu085-bot"
          git config user.email "partiu085-bot@users.noreply.github.com"
          git add docs/noticias.json docs/noticias_img || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Notícias $(TZ=America/Fortaleza date '+%d/%m %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && exit 0; sleep 5; done
