name: Fotos dos destinos
on:
  workflow_dispatch:
    inputs:
      destinos:
        description: "Códigos (ex.: VIX REC). Vazio = os que faltam"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - run: mkdir -p docs/fotos && python engine/fotos.py ${{ github.event.inputs.destinos }} | tee docs/fotos/log.txt
      - run: |
          git config user.name "partiu085-bot"; git config user.email "partiu085-bot@users.noreply.github.com"
          git add docs/fotos && git commit -q -m "Fotos dos destinos" && for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && exit 0; sleep 5; done
