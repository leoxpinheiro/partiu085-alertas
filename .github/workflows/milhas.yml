name: Milhas Partiu085

on:
  workflow_dispatch:
    inputs:
      sondar:
        description: "Só testar as fontes (não salva)"
        required: false
        default: "nao"

permissions:
  contents: write

concurrency:
  group: alertas
  cancel-in-progress: false

jobs:
  milhas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Sondar fontes
        if: github.event.inputs.sondar == 'sim'
        run: |
          mkdir -p data
          { python engine/milhas.py --sondar
          } > data/sonda_milhas.txt 2>&1
          cat data/sonda_milhas.txt
          git config user.name "partiu085-bot"
          git config user.email "partiu085-bot@users.noreply.github.com"
          git add data/sonda_milhas.txt && git commit -q -m "Sonda milhas" && git pull --rebase -X theirs -q && git push -q
      - name: Atualizar milhas
        if: github.event.inputs.sondar != 'sim'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_MILHAS: ${{ secrets.TELEGRAM_CHAT_MILHAS }}
        run: python engine/milhas.py
      - name: Salvar
        if: github.event.inputs.sondar != 'sim'
        run: |
          git config user.name "partiu085-bot"
          git config user.email "partiu085-bot@users.noreply.github.com"
          git add docs/milhas.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Milhas $(TZ=America/Fortaleza date '+%d/%m %H:%M')"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && exit 0; sleep 5; done
          exit 1
