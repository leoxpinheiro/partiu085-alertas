name: Números do dia (comissões e ranking)
on:
  schedule:
    - cron: "11 11 * * *"   # 08:11 em Fortaleza
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ler:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: python engine/afiliados.py
      - run: python engine/ranking.py
      - run: |
          git config user.name "partiu085-bot"
          git config user.email "partiu085-bot@users.noreply.github.com"
          git add docs/afiliados.json docs/ig_ranking.json docs/ideias_virais.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Comissões de afiliado"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q && exit 0; sleep 7; done; exit 1
