<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Partiu 085 · Grupos de passagens</title>
<meta name="description" content="Grupos do Partiu085: alertas de passagens baratas saindo de Fortaleza, VIP, milhas e comunidade.">
<meta property="og:title" content="Partiu085 · Passagens baratas saindo de Fortaleza">
<meta property="og:description" content="Entre nos grupos e receba as promoções na hora.">
<link rel="icon" type="image/png" href="marca/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300..800&family=Anton&family=Kaushan+Script&display=swap" rel="stylesheet">
<style>
:root{--lime:#F5C531;--ink:#FFFFFF;--sage:#173A5E;--tile:#FFFFFF;--sub:rgba(255,255,255,.82);--ter:rgba(255,255,255,.7);--glass:rgba(255,255,255,.12);--line:rgba(255,255,255,.18)}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;
  background:linear-gradient(170deg,#3E86E8 0%,#1F5FBF 45%,#173A5E 100%);background-attachment:fixed}
.w{max-width:520px;margin:0 auto;padding:48px 16px 40px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;margin-bottom:8px}
.logo{width:220px;height:auto;filter:drop-shadow(0 10px 24px rgba(0,0,0,.25))}
.script{font-family:"Kaushan Script",cursive;color:var(--lime);font-size:26px;margin-top:-6px}
h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:34px;letter-spacing:.02em;line-height:1.05}
.top p{color:var(--sub);font-size:15px;line-height:1.45;max-width:36ch}
.st{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.14);font-size:13px;font-weight:600;color:#fff}
.st b{width:8px;height:8px;border-radius:50%;background:#F5C531}
a.g{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:28px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:inset 0 0 0 1px var(--line);text-decoration:none;color:inherit;transition:transform .12s cubic-bezier(.22,1,.36,1)}
a.g:active{transform:scale(.98)}
a.g.vip{background:var(--lime);color:#173A5E;box-shadow:none}
a.g.vip .ic{background:#173A5E;color:#F5C531}
.ic{width:46px;height:46px;border-radius:30%;background:var(--lime);color:#173A5E;display:grid;place-items:center;flex-shrink:0}
a.g.vip .ic{background:rgba(255,255,255,.6)}
.ic svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.t{flex:1;min-width:0}
.t b{display:block;font-size:16px;font-weight:600;letter-spacing:-.01em}
.t span{display:block;font-size:13px;color:var(--sub);margin-top:2px;line-height:1.4}
a.g.vip .t span{color:rgba(23,58,94,.75)}
.pr{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#173A5E;color:#fff;white-space:nowrap}
.seta{font-size:22px;opacity:.6}
#lista{display:flex;flex-direction:column;gap:12px}
.foot{text-align:center;font-size:12px;color:var(--ter);margin-top:12px;line-height:1.6}
.foot a{color:inherit}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="gratis" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></symbol>
  <symbol id="vip" viewBox="0 0 24 24"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></symbol>
  <symbol id="milhas" viewBox="0 0 24 24"><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></symbol>
  <symbol id="comunidade" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
  <symbol id="outro" viewBox="0 0 24 24"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></symbol>
</svg>
<div class="w">
  <header class="top">
    <img class="logo" src="marca/logo.png" alt="Partiu 085">
    <h1>ALERTAS DE PASSAGENS</h1><div class="script">saindo do 085</div>
    <p>Viajar bem é questão de oportunidade — e a gente te avisa quando ela aparece.</p>
    <span class="st" id="st"><b></b>Radar ligado</span>
  </header>
  <main id="lista"></main>
  <p class="foot">Preços podem mudar a qualquer momento.<br><a href="https://www.instagram.com/partiu.085" target="_blank" rel="noopener">@partiu.085</a></p>
</div>
<script>
const PADRAO = [
  { id: "gratis", nome: "Partiu085 · Alertas grátis", desc: "Promoções de passagens saindo de Fortaleza, todos os dias.", link: "https://bit.ly/radar085", ativo: true },
];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
(async () => {
  let G = PADRAO, semana = 0;
  try { const r = await fetch("grupos.json?t=" + Date.now()); if (r.ok) G = await r.json(); } catch (e) { }
  try {
    const a = await (await fetch("alerts.json?t=" + Date.now())).json();
    const lim = new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 10);
    semana = (a.alertas || []).filter(x => x.criado.slice(0, 10) >= lim).length;
  } catch (e) { }
  if (semana) document.getElementById("st").innerHTML = `<b></b>${semana} promoções encontradas nos últimos 7 dias`;
  const ativos = G.filter(g => g.ativo !== false && g.link);
  document.getElementById("lista").innerHTML = ativos.length ? ativos.map(g => `
    <a class="g ${g.id === "vip" ? "vip" : ""}" href="${esc(g.link)}" target="_blank" rel="noopener">
      <span class="ic"><svg><use href="#${["gratis", "vip", "milhas", "comunidade"].includes(g.id) ? g.id : "outro"}"/></svg></span>
      <span class="t"><b>${esc(g.nome)}</b><span>${esc(g.desc)}</span></span>
      ${g.preco ? `<span class="pr">${esc(g.preco)}</span>` : `<span class="seta">→</span>`}
    </a>`).join("") : `<p style="text-align:center;color:var(--sub)">Em breve.</p>`;
})();
</script>
</body>
</html>
