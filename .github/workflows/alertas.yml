name: Alertas Partiu085

on:
  workflow_dispatch:
    inputs:
      rotas:
        description: "Buscar só estas rotas agora (ex.: LIS,REC). Vazio = rodada normal"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: alertas
  cancel-in-progress: false

jobs:
  rodada:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pistas da Travelpayouts
        continue-on-error: true
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: python engine/descobrir.py
      - name: Procurar promoções
        env:
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ROTAS_AGORA: ${{ github.event.inputs.rotas }}
        run: |
          set -o pipefail
          mkdir -p data
          python engine/run.py 2>&1 | tee data/ultima_rodada.log
      - name: Radar de milhas
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_MILHAS: ${{ secrets.TELEGRAM_CHAT_MILHAS }}
          GECKO_API_KEY: ${{ secrets.GECKO_API_KEY }}
          SEATS_AERO_KEY: ${{ secrets.SEATS_AERO_KEY }}
          MILHAS_API_KEY: ${{ secrets.MILHAS_API_KEY }}
        run: |
          python engine/milhas.py
          python engine/milhas_busca.py
      - name: Salvar resultados
        if: always()
        run: |
          git config user.name "partiu085-bot"
          git config user.email "partiu085-bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet && exit 0
          git commit -q -m "Radar $(TZ=America/Fortaleza date '+%d/%m %H:%M')"
          for i in 1 2 3; do
            git pull --rebase -X theirs -q && git push -q && exit 0
            sleep 5
          done
          exit 1
