name: Alertas Partiu085

on:
  schedule:
    - cron: "17 */3 * * *"   # a cada 3 horas
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: alertas
  cancel-in-progress: false

jobs:
  rodada:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Procurar promoções
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python engine/run.py
      - name: Salvar resultados
        run: |
          git config user.name "partiu085-bot"
          git config user.email "partiu085-bot@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet || git commit -m "Alertas $(TZ=America/Fortaleza date '+%d/%m %H:%M')"
          git pull --rebase -q || true
          git push
