name: Relógio do radar

# Dispara uma rodada do radar e, depois de um intervalo que depende do dia, dispara a si mesmo de novo.
# (O agendador "schedule" do GitHub falha com frequência; este relógio não depende dele.)
on:
  workflow_dispatch: {}
  schedule:
    - cron: "5 */6 * * *"   # só para religar o relógio se ele parar

permissions:
  actions: write
  contents: read

concurrency:
  group: relogio
  cancel-in-progress: true

jobs:
  tique:
    runs-on: ubuntu-latest
    timeout-minutes: 230
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/status.json
            engine/.telegram_admin
          sparse-checkout-cone-mode: false
      - name: Vigia (avisa se o radar ficou mais de 3h sem terminar uma rodada)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.parse
          from datetime import datetime, timezone, timedelta
          u = json.load(open("docs/status.json")).get("ultima_rodada", "")
          h = (datetime.now(timezone(timedelta(hours=-3))) - datetime.fromisoformat(u)).total_seconds() / 3600 if u else 99
          print(f"última rodada: {u} ({h:.1f}h)")
          chat = os.environ.get("TELEGRAM_ADMIN_ID") or (open("engine/.telegram_admin").read().strip() if os.path.exists("engine/.telegram_admin") else "")
          if h > 3 and chat and os.environ.get("TELEGRAM_BOT_TOKEN"):
              msg = f"⚠️ Radar Partiu 085: nenhuma rodada terminou nas últimas {h:.0f}h. Já mandei rodar de novo; se continuar, me avise."
              urllib.request.urlopen(f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage", urllib.parse.urlencode({"chat_id": chat, "text": msg}).encode(), timeout=20)
          PY
      - name: Rodar o radar agora
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/alertas.yml/dispatches" \
            -d '{"ref":"main","inputs":{"rotas":""}}'
      - name: Esperar (seg–qua ~55min · qui–sex ~1h10 · fim de semana ~1h40)
        run: |
          d=$(TZ=America/Fortaleza date +%u)
          if [ "$d" -le 3 ]; then s=3600; elif [ "$d" -le 5 ]; then s=4200; else s=6000; fi
          echo "dia $d: esperando $s segundos"; sleep $s
      - name: Dar corda de novo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/relogio.yml/dispatches" \
            -d '{"ref":"main"}'
