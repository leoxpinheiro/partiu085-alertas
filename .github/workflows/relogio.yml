name: Relógio do radar

# Dispara uma rodada do radar e, 2 horas depois, dispara a si mesmo de novo.
# (O agendador "schedule" do GitHub falha com frequência; este relógio não depende dele.)
on:
  workflow_dispatch: {}
  schedule:
    - cron: "5 */6 * * *"   # só para religar o relógio se ele parar

permissions:
  actions: write

concurrency:
  group: relogio
  cancel-in-progress: true

jobs:
  tique:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - name: Rodar o radar agora
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/alertas.yml/dispatches" \
            -d '{"ref":"main","inputs":{"rotas":""}}'
      - name: Esperar ~2 horas
        run: sleep 7080
      - name: Dar corda de novo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/relogio.yml/dispatches" \
            -d '{"ref":"main"}'
