name: Relatório semanal (Telegram)

on:
  workflow_dispatch:
  schedule:
    - cron: "50 11 * * 1"

permissions:
  contents: write

jobs:
  relatorio:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
        run: python engine/relatorio.py
      - name: Salvar admin
        run: |
          git config user.name "partiu085-bot"
          git config user.email "partiu085-bot@users.noreply.github.com"
          git add -f engine/.telegram_admin 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -q -m "Telegram: admin cadastrado"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
