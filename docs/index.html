<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Partiu085 · Alertas</title>
<meta name="description" content="Alertas de passagens baratas saindo de Fortaleza.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1e9;--card:#fff;--sunk:#efe6d8;--line:#e5d9c7;--ink:#12303a;--ink2:#3c5a64;--muted:#6f878f;
  --mar:#0e7c86;--mar2:#12a3b0;--coral:#e0582f;--ok:#0f7a57;--ok-soft:#e1f2ea;--warn:#a86b00;--warn-soft:#fbf0d9;
  --shadow:0 6px 22px -10px rgb(18 48 58/.25),0 1px 3px rgb(18 48 58/.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1d23;--card:#12282f;--sunk:#18333b;--line:#21414a;--ink:#e9f2f3;--ink2:#bcd2d6;--muted:#8aa3aa;
  --mar:#2bb7c3;--mar2:#3fd0db;--coral:#ff7a55;--ok:#4cd39b;--ok-soft:#173a30;--warn:#f0b443;--warn-soft:#3a2f17;
  --shadow:0 6px 22px -10px rgb(0 0 0/.6)}}
:root[data-theme="dark"]{--bg:#0c1d23;--card:#12282f;--sunk:#18333b;--line:#21414a;--ink:#e9f2f3;--ink2:#bcd2d6;--muted:#8aa3aa;
  --mar:#2bb7c3;--mar2:#3fd0db;--coral:#ff7a55;--ok:#4cd39b;--ok-soft:#173a30;--warn:#f0b443;--warn-soft:#3a2f17}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1,h2,.num,.preco{font-family:"Inter Tight",Inter,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:10px}
.logo .ic{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--mar2),var(--mar));display:grid;place-items:center;font-size:20px}
.logo h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
.logo p{font-size:12.5px;color:var(--muted)}
.upd{font-size:12px;color:var(--muted);text-align:right}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat .num{font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat .lbl{font-size:12px;color:var(--muted)}
.teste{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:16px}
.teste h2{font-size:14px;font-weight:700;margin-bottom:2px}
.teste .sub{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.barras{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;align-items:end;height:86px}
.barra{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.barra i{display:block;width:100%;max-width:34px;border-radius:6px 6px 3px 3px;background:var(--mar);min-height:3px}
.barra.meta i{background:var(--ok)}
.barra b{font-size:11px;font-weight:600}
.barra span{font-size:10px;color:var(--muted)}
.filtros{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}
.filtros button{border:1px solid var(--line);background:var(--card);color:var(--ink2);padding:7px 14px;border-radius:999px;font:600 13px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.filtros button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dia{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 2px 8px}
.alerta{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.topo{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rota{font-size:13px;color:var(--muted);font-weight:500}
.dest{font-family:"Inter Tight";font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.preco{font-size:26px;font-weight:800;color:var(--coral);letter-spacing:-.02em;text-align:right;line-height:1.1}
.preco small{display:block;font:500 11.5px Inter,sans-serif;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.tag{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:8px;background:var(--sunk);color:var(--ink2)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.datas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.datas span{font-size:12.5px;font-weight:600;padding:5px 9px;border:1px dashed var(--line);border-radius:9px;font-variant-numeric:tabular-nums}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
.bt{flex:1;min-width:130px;text-align:center;text-decoration:none;border:none;cursor:pointer;padding:10px 12px;border-radius:12px;font:600 13.5px Inter,sans-serif;background:var(--sunk);color:var(--ink)}
.bt.zap{background:#1fa855;color:#fff}
.bt.copy.ok{background:var(--ok);color:#fff}
.vazio{text-align:center;color:var(--muted);padding:40px 16px;background:var(--card);border:1px dashed var(--line);border-radius:18px}
.hora{font-size:11.5px;color:var(--muted);margin-top:10px}
@media (max-width:480px){.stat .num{font-size:22px}.dest{font-size:18px}.preco{font-size:22px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><div class="ic">✈️</div><div><h1>Partiu085</h1><p>Passagens baratas saindo de Fortaleza</p></div></div>
    <div class="upd" id="upd">carregando…</div>
  </header>

  <div class="stats">
    <div class="stat"><div class="num" id="sHoje">–</div><div class="lbl">alertas hoje</div></div>
    <div class="stat"><div class="num" id="s10">–</div><div class="lbl">últimos 10 dias</div></div>
    <div class="stat"><div class="num" id="sMedia">–</div><div class="lbl">média por dia</div></div>
  </div>

  <div class="teste">
    <h2>Teste de 10 dias · meta: 6 alertas bons por dia</h2>
    <div class="sub">Barra verde = dia que bateu a meta.</div>
    <div class="barras" id="barras"></div>
  </div>

  <div class="filtros" id="filtros">
    <button class="on" data-f="todos">Todos</button>
    <button data-f="nacional">Nacional</button>
    <button data-f="internacional">Internacional</button>
  </div>

  <div id="lista"></div>
</div>

<script>
const META = 6;
const fmt = v => "R$ " + Math.round(v).toLocaleString("pt-BR");
const dm = s => s.slice(8,10) + "/" + s.slice(5,7);
const diaISO = d => d.slice(0,10);
let ALERTAS = [], FILTRO = "todos";

function hojeFortaleza(){
  const d = new Date(Date.now() - 3*3600e3);
  return d.toISOString().slice(0,10);
}
function nomeDia(iso){
  const h = hojeFortaleza();
  const ontem = new Date(new Date(h+"T12:00:00Z").getTime()-864e5).toISOString().slice(0,10);
  if (iso===h) return "Hoje";
  if (iso===ontem) return "Ontem";
  const [y,m,d] = iso.split("-");
  return d+"/"+m;
}

function stats(){
  const h = hojeFortaleza();
  const dias = [];
  for (let i=9;i>=0;i--) dias.push(new Date(new Date(h+"T12:00:00Z").getTime()-i*864e5).toISOString().slice(0,10));
  const cont = Object.fromEntries(dias.map(d=>[d,0]));
  ALERTAS.forEach(a=>{const d=diaISO(a.criado); if(d in cont) cont[d]++;});
  const tot = Object.values(cont).reduce((a,b)=>a+b,0);
  const ativos = dias.filter(d=>cont[d]>0 || d===h).length || 1;
  document.getElementById("sHoje").textContent = cont[h];
  document.getElementById("s10").textContent = tot;
  document.getElementById("sMedia").textContent = (tot/ativos).toFixed(1).replace(".",",");
  const max = Math.max(META, ...Object.values(cont));
  document.getElementById("barras").innerHTML = dias.map(d=>`
    <div class="barra ${cont[d]>=META?"meta":""}"><b>${cont[d]}</b>
    <i style="height:${Math.max(3,cont[d]/max*58)}px"></i><span>${d.slice(8,10)}/${d.slice(5,7)}</span></div>`).join("");
}

function card(a){
  const datas = a.datas.slice(0,10).map(d=>`<span>${dm(d.ida)} → ${dm(d.volta)}</span>`).join("")
    + (a.datas.length>10?`<span>+${a.datas.length-10} datas</span>`:"");
  const paradas = a.escalas===0?"voo direto":`${a.escalas} parada${a.escalas>1?"s":""}`;
  const zap = "https://wa.me/?text=" + encodeURIComponent(a.texto);
  return `<div class="alerta">
    <div class="topo">
      <div><div class="rota">Fortaleza →</div><div class="dest">${a.destino_nome}</div></div>
      <div class="preco">${fmt(a.preco)}<small>ida e volta</small></div>
    </div>
    <div class="tags">
      <span class="tag ok">−${Math.round(a.desconto*100)}% do normal (${fmt(a.preco_tipico)})</span>
      ${a.cia_nome?`<span class="tag">${a.cia_nome}</span>`:""}
      <span class="tag">${paradas}</span>
      <span class="tag">${a.datas.length} data${a.datas.length>1?"s":""} · ${a.meses.join(", ")}</span>
      ${a.verificado?`<span class="tag ok">✓ conferido no Google</span>`:`<span class="tag warn">confira antes de enviar</span>`}
    </div>
    <div class="datas">${datas}</div>
    <div class="acoes">
      <button class="bt copy" data-id="${a.id}">📋 Copiar texto</button>
      <a class="bt zap" href="${zap}" target="_blank" rel="noopener">Enviar no WhatsApp</a>
      <a class="bt" href="${a.link_google}" target="_blank" rel="noopener">Ver no Google Voos</a>
    </div>
    <div class="hora">Encontrado ${a.criado.slice(11,16)}</div>
  </div>`;
}

function render(){
  const lista = ALERTAS.filter(a=>FILTRO==="todos"||a.tipo===FILTRO);
  const el = document.getElementById("lista");
  if (!lista.length){ el.innerHTML = `<div class="vazio">Nenhum alerta ainda. O motor procura promoções a cada 3 horas.</div>`; return; }
  let html="", ult="";
  lista.forEach(a=>{const d=diaISO(a.criado); if(d!==ult){html+=`<div class="dia">${nomeDia(d)}</div>`;ult=d;} html+=card(a);});
  el.innerHTML = html;
}

document.getElementById("filtros").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  FILTRO=b.dataset.f; document.querySelectorAll("#filtros button").forEach(x=>x.classList.toggle("on",x===b)); render();
});
document.getElementById("lista").addEventListener("click",async e=>{
  const b=e.target.closest(".copy"); if(!b) return;
  const a=ALERTAS.find(x=>x.id===b.dataset.id);
  try{ await navigator.clipboard.writeText(a.texto); }catch(_){
    const t=document.createElement("textarea"); t.value=a.texto; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove();
  }
  b.textContent="✓ Copiado!"; b.classList.add("ok"); setTimeout(()=>{b.textContent="📋 Copiar texto";b.classList.remove("ok")},1800);
});

fetch("alerts.json?t="+Date.now()).then(r=>r.json()).then(j=>{
  ALERTAS=(j.alertas||[]).sort((a,b)=>b.criado.localeCompare(a.criado));
  document.getElementById("upd").innerHTML = "Atualizado<br>"+(j.atualizado?nomeDia(j.atualizado.slice(0,10))+" "+j.atualizado.slice(11,16):"–");
  stats(); render();
}).catch(()=>{document.getElementById("upd").textContent="sem dados ainda"; ALERTAS=[]; stats(); render();});
</script>
</body>
</html>
