name: Radar do feriado
on:
  schedule:
    - cron: "17 13 * * *"   # 10:17 em Fortaleza
  workflow_dispatch:
    inputs:
      feriados:
        description: "ids dos feriados (vazio = os 4 próximos)"
        type: string
        default: ""
permissions:
  contents: write
concurrency:
  group: feriado
jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python engine/feriado.py ${{ inputs.feriados }}
      - run: |
          git config user.name "partiu085-bot"
          git config user.email "partiu085-bot@users.noreply.github.com"
          git add docs/feriados.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Radar do feriado"
          for i in 1 2 3 4 5 6; do git pull -q --rebase origin main && git push -q && exit 0; sleep $((RANDOM % 15 + 5)); done; exit 1
