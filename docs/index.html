<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Radar Partiu085</title>
<meta name="description" content="Radar de passagens baratas saindo de Fortaleza.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='%230b1015' stroke='%232dd67b' stroke-width='8'/><circle cx='50' cy='50' r='10' fill='%232dd67b'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>try{var t=localStorage.getItem("p085_tema");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>

<body>
<div class="topbar">
  <div class="brand"><div class="radar"></div><div><b>PARTIU<span>085</span></b><small>radar de passagens</small></div></div>

</div>
<div class="app">

      <span id="ultima">–</span>
      <button class="theme-bt" data-act="tema">◐ Tema claro/escuro</button>
    </div>
  </aside>
  <main class="main" id="main"><div class="vazio">Carregando o radar…</div></main>
</div>
<nav class="bottom" id="bottom"></nav>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

</html>
