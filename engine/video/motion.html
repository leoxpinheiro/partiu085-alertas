 [[34,0],[-20,-6],[-30,-26],[-38,-26],[-32,-5],[-44,-4],[-50,-14],[-56,-14],[-52,0],[-56,14],[-50,14],[-44,4],[-32,5],[-38,26],[-30,26],[-20,6]].forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.closePath();c.fill();c.restore();}
