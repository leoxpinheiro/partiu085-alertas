name: Sonda navegador milhas
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: |
          mkdir -p data
          python engine/sonda_navegador.py > data/sonda_navegador.txt 2>&1 || true
          git config user.name "partiu085-bot"; git config user.email "partiu085-bot@users.noreply.github.com"
          git add data/sonda_navegador.txt && git commit -q -m "Sonda navegador" && git pull --rebase -X theirs -q && git push -q
